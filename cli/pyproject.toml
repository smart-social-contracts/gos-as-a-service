[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaas-cli"
version = "0.1.0"
description = "GaaS platform deployment CLI — descriptor-driven one-command deploys"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
gaas = "gaas.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
