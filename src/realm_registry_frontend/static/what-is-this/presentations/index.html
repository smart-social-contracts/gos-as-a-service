<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gos.earth · Presentations and videos</title>
  <style>
    :root {
      --gray-50: #fafafa;
      --gray-100: #f0f0f0;
      --gray-200: #e5e5e5;
      --gray-300: #d4d4d4;
      --gray-400: #a3a3a3;
      --gray-500: #737373;
      --gray-600: #525252;
      --gray-700: #404040;
      --gray-800: #262626;
      --gray-900: #171717;
      --panel: #ffffff;
      --teal: rgb(107, 163, 163);
      --teal-d: rgb(47, 95, 95);
      --teal-bg: rgba(107, 163, 163, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--panel);
      color: var(--gray-900);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main { flex: 1; width: min(76rem, 100%); margin: 0 auto; padding: 2.4rem 2rem 2rem; }

    .kicker { font-size: 0.8rem; font-weight: 650; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 0.35rem; }
    header { border-bottom: 2px solid var(--gray-900); padding-bottom: 0.75rem; }
    header h1 { font-size: 2.2rem; font-weight: 750; letter-spacing: -0.02em; line-height: 1.15; }
    .lead { margin-top: 0.9rem; font-size: 1.15rem; color: var(--gray-600); line-height: 1.4; max-width: 46rem; }

    .list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: 1.4rem; margin-top: 2rem; }
    .item a, .item button {
      display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left;
      border: 2px solid var(--gray-200); border-radius: 12px; background: #fff; overflow: hidden;
      color: inherit; text-decoration: none; font: inherit; cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .item a:hover, .item button:hover { border-color: var(--teal); box-shadow: 0 6px 22px rgba(47, 95, 95, 0.12); transform: translateY(-2px); }
    .item a:focus-visible, .item button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

    .poster { position: relative; aspect-ratio: 16 / 9; background: var(--gray-50); border-bottom: 1px solid var(--gray-200); display: grid; place-items: center; overflow: hidden; }
    .poster svg, .poster img { width: 78%; height: 78%; object-fit: contain; display: block; }
    .poster img.cover { width: 100%; height: 100%; object-fit: cover; }
    .play {
      position: absolute; width: 3.6rem; height: 3.6rem; border-radius: 50%;
      background: rgba(23, 23, 23, 0.82); display: grid; place-items: center;
    }
    .play::after { content: ""; margin-left: 0.3rem; border-style: solid; border-width: 0.7rem 0 0.7rem 1.15rem; border-color: transparent transparent transparent #fff; }

    .meta { padding: 1rem 1.15rem 1.15rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }
    .kind { display: inline-flex; gap: 0.5rem; align-items: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-500); }
    .kind .pill { padding: 0.05rem 0.5rem; border-radius: 999px; border: 1.5px solid var(--gray-300); }
    .kind .pill.video { border-color: var(--teal); color: var(--teal-d); background: var(--teal-bg); }
    .meta h2 { font-size: 1.3rem; font-weight: 750; letter-spacing: -0.01em; line-height: 1.25; }
    .meta h2 span { display: block; font-size: 0.82em; font-weight: 650; color: var(--gray-500); margin-top: 0.15rem; }
    .meta p { font-size: 1rem; color: var(--gray-600); line-height: 1.45; }
    .facts { margin-top: auto; padding-top: 0.4rem; font-size: 0.88rem; color: var(--gray-500); }

    footer { width: min(76rem, 100%); margin: 0 auto; padding: 1rem 2rem 1.4rem; display: flex; justify-content: space-between; color: var(--gray-500); }
    footer a { color: inherit; text-decoration: none; font-size: 1.1rem; transition: color 0.2s; }
    footer a:hover { color: var(--teal-d); }

    /* A video plays in a sheet over the list. */
    .sheet { position: fixed; inset: 0; z-index: 10; background: rgba(23, 23, 23, 0.86); display: none; align-items: center; justify-content: center; padding: 2rem; }
    .sheet.open { display: flex; }
    .sheet .frame { width: min(70rem, 100%); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
    .sheet video, .sheet iframe { width: 100%; height: 100%; border: 0; display: block; }
    .sheet .close { position: absolute; top: 1rem; right: 1.25rem; background: none; border: none; color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; }

    @media (max-width: 700px) {
      main { padding: 1.4rem 1rem 1rem; }
      header h1 { font-size: 1.6rem; }
      .lead { font-size: 1rem; }
      .list { grid-template-columns: minmax(0, 1fr); gap: 1rem; margin-top: 1.4rem; }
      footer { padding: 0.8rem 1rem 1.2rem; }
      .sheet { padding: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .item a, .item button { transition: none; }
      .item a:hover, .item button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="kicker">What is this?</div>
      <h1>Presentations and videos</h1>
    </header>
    <p class="lead">Short explanations of governance operating systems, the GGG standard and how realms work. Each presentation advances with a click, the arrow keys or a swipe.</p>
    <ul class="list" id="list"></ul>
  </main>
  <footer>
    <a href="/">gos.earth</a>
  </footer>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Video">
    <button class="close" id="close" type="button" aria-label="Close">×</button>
    <div class="frame" id="frame"></div>
  </div>

  <script>
/* The list. Add an entry to add a presentation or a video; they show in this order.
   A presentation: { kind: "deck", title, subtitle, about, href, facts, art }
   A video:        { kind: "video", title, subtitle, about, facts, poster, src }   a file, played here
                   { kind: "video", title, subtitle, about, facts, poster, embed } a player page (e.g. YouTube's embed URL)
   `art` names a drawing below; `poster` is an image path, relative to this page. */
const ITEMS = [
  {
    kind: "deck",
    title: "Think of our world as a computer",
    subtitle: "Governance Operating System",
    about: "Governance as a stream of acts, the world as a computer, and the realms that run a Governance Operating System today.",
    href: "../index.html",
    facts: "English, Español, Deutsch, Français, 中文, Italiano",
    art: "world",
  },
  {
    kind: "deck",
    title: "Generalized Global Governance (GGG)",
    subtitle: "A standard for scalable governance systems",
    about: "Why governance needs a shared standard, what GGG defines, and how one GOS implements it: legislation as code, realms and quarters, and a change travelling from Spain to València.",
    href: "../ggg/index.html",
    facts: "English · 26 slides",
    art: "ggg",
  },
];

const ART = {
  world: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <circle cx="160" cy="90" r="70" fill="#fff" stroke="#737373" stroke-width="2"/>
      <g fill="none" stroke="#d4d4d4" stroke-width="1.5">
        <ellipse cx="160" cy="90" rx="30" ry="70"/><ellipse cx="160" cy="90" rx="56" ry="70"/>
        <path d="M90 90H230M100 55H220M100 125H220"/>
      </g>
      <path d="M160 20V160" stroke="#d4d4d4" stroke-width="1.5"/>
      <g fill="rgb(107, 163, 163)"><circle cx="128" cy="62" r="5"/><circle cx="184" cy="78" r="5"/><circle cx="150" cy="118" r="5"/><circle cx="204" cy="112" r="5"/></g>
    </svg>`,
  ggg: `<svg viewBox="0 0 320 180" aria-hidden="true">
      <g fill="none" stroke="rgb(107, 163, 163)" stroke-width="2"><path d="M160 90 L70 42M160 90 L250 42M160 90 L70 138M160 90 L250 138M160 90 L40 90M160 90 L280 90"/></g>
      <circle cx="160" cy="90" r="38" fill="#fff" stroke="rgb(107, 163, 163)" stroke-width="2.5"/>
      <text x="160" y="97" text-anchor="middle" style="font: 800 20px system-ui, sans-serif; fill: rgb(47, 95, 95)">GGG</text>
      <g fill="#fff" stroke="#a3a3a3" stroke-width="1.5">
        <rect x="56" y="30" width="28" height="24" rx="3"/><rect x="236" y="30" width="28" height="24" rx="3"/>
        <rect x="56" y="126" width="28" height="24" rx="3"/><rect x="236" y="126" width="28" height="24" rx="3"/>
        <rect x="26" y="78" width="28" height="24" rx="3"/><rect x="266" y="78" width="28" height="24" rx="3"/>
      </g>
    </svg>`,
};

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function poster(item) {
  const art = item.poster ? `<img class="cover" src="${esc(item.poster)}" alt="">` : (ART[item.art] || "");
  return `<div class="poster">${art}${item.kind === "video" ? '<span class="play"></span>' : ""}</div>`;
}

function meta(item) {
  const kind = item.kind === "video" ? '<span class="pill video">Video</span>' : '<span class="pill">Presentation</span>';
  const subtitle = item.subtitle ? `<span>${esc(item.subtitle)}</span>` : "";
  return `<div class="meta"><div class="kind">${kind}</div><h2>${esc(item.title)}${subtitle}</h2>` +
    `<p>${esc(item.about)}</p>${item.facts ? `<div class="facts">${esc(item.facts)}</div>` : ""}</div>`;
}

const list = document.getElementById("list");
ITEMS.forEach((item, i) => {
  const li = document.createElement("li");
  li.className = "item";
  li.innerHTML = item.kind === "video"
    ? `<button type="button" data-video="${i}">${poster(item)}${meta(item)}</button>`
    : `<a href="${esc(item.href)}">${poster(item)}${meta(item)}</a>`;
  list.appendChild(li);
});

const sheet = document.getElementById("sheet");
const frame = document.getElementById("frame");
function close() {
  sheet.classList.remove("open");
  frame.innerHTML = "";
}
list.addEventListener("click", (e) => {
  const button = e.target.closest("[data-video]");
  if (!button) return;
  const item = ITEMS[parseInt(button.dataset.video, 10)];
  frame.innerHTML = item.embed
    ? `<iframe src="${esc(item.embed)}" title="${esc(item.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
    : `<video src="${esc(item.src)}" controls autoplay playsinline${item.poster ? ` poster="${esc(item.poster)}"` : ""}></video>`;
  sheet.classList.add("open");
});
document.getElementById("close").addEventListener("click", close);
sheet.addEventListener("click", (e) => { if (e.target === sheet) close(); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  </script>
</body>
</html>
