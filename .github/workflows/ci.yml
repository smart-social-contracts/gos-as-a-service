name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Black --check
        # Non-blocking, matching realms CI: extracted sources predate black 26.x
        # formatting rules; keep them byte-close to the realms originals.
        continue-on-error: true
        run: pip install black && black --check src/ tests/ scripts/
      - name: No principal / canister-id tables outside casals.json
        # The environment is declared in casals.json; canister code, scripts and
        # workflows must not carry their own copies of ids (they drift, then a
        # rebuilt environment points at a deleted canister). Ids reach a canister
        # at runtime via configure / set_canister_config_json. Test fixtures and
        # generated declarations are exempt.
        run: |
          if grep -rnoE '\b[a-z0-9]{5}(-[a-z0-9]{5}){3,10}-[a-z0-9]{3}\b' \
               scripts .github src \
               --include='*.py' --include='*.yml' --include='*.sh' --include='*.js' --include='*.svelte' --include='ic-domains' --include='ii-alternative-origins' \
               --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.svelte-kit --exclude-dir=declarations --exclude-dir=__pycache__ --exclude-dir=tests --exclude='*.test.js'; then
            echo "::error::canister/principal ids belong in casals.json (read them with 'casals export')"; exit 1
          fi
          test ! -d cli || { echo "::error::the gaas CLI was deleted in favour of 'casals up'; do not resurrect it"; exit 1; }

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python test deps
        run: pip install -r requirements-dev.txt
      - name: Backend unit tests
        run: python3 -m pytest tests/backend/ -q
      - name: Probe baked Casals frontends
        run: python3 scripts/canister_liveness.py --probe-baked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version
      - name: Install npm deps
        run: npm ci --legacy-peer-deps
      - name: Generate candid declarations
        run: |
          dfx generate realm_registry_backend
          dfx generate realm_installer
      - name: Frontend unit tests
        run: npm run test:unit --workspace=realm_registry_frontend
      - name: Frontend build
        run: npm run build --workspace=realm_registry_frontend

  integration:
    needs: [unit, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version
      - name: Basilisk venv
        run: |
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4
      - name: Start local replica
        run: |
          dfx start --background --clean --host 127.0.0.1:4943
          sleep 3
          dfx ping
      - name: Deploy registry stack
        run: |
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          dfx deploy realm_registry_backend --yes
          dfx deploy realm_installer --yes
      - name: realm_installer API tests
        run: python3 tests/integration/test_realm_installer_api.py
      - name: Stop local replica
        if: always()
        run: dfx stop || true
