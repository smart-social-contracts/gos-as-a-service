name: GaaS E2E

on:
  pull_request:
    paths:
      - "casals.json"
      - "src/**"
      - "dfx.json"
      - "tests/e2e/**"
      - "scripts/up.sh"
      - ".github/workflows/gaas-e2e.yml"
  workflow_dispatch:

concurrency:
  group: gaas-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"
  CASALS_VERSION: "main"
  REALMS_VERSION: "main"
  FILE_REGISTRY_VERSION: "main"
  IC_TOKENS_VERSION: "0.1.0"
  # The whole GaaS environment is `casals.json`; the Casals e2e harness builds it
  # from an empty replica and grades it, then a realm is born the way the portal
  # does it. Both scripts share one CASALS_HOME (bindings) and one icp identity.
  CASALS_HOME: ${{ github.workspace }}/casals-home
  CASALS_E2E_ENV: local
  CASALS_E2E_IDENTITY: local-dev
  ENV: local
  IDENTITY: local-dev

jobs:
  gaas-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The sheet resolves `local:` sources against its own directory:
      # `../realms/...` for the realm stand template, `../file-registry/...` for
      # the platform file registry, `.basilisk/...` for the platform wasms. The
      # four repos must therefore be siblings.
      - uses: actions/checkout@v4
        with:
          path: gos-as-a-service

      - name: Checkout Casals (conductor + CLI + e2e harness)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/Casals
          ref: ${{ env.CASALS_VERSION }}
          path: Casals
          submodules: recursive

      - name: Checkout realms (realm backend/frontend the stand template installs)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/realms
          ref: ${{ env.REALMS_VERSION }}
          path: realms
          submodules: recursive

      # The platform file registry (branding, extension packages) is the
      # standalone file-registry canister; casals.json reads its wasm from
      # ../file-registry/.basilisk (sibling checkout).
      - name: Checkout file-registry (platform file registry wasm)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/file-registry
          ref: ${{ env.FILE_REGISTRY_VERSION }}
          path: file-registry

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # dfx is only used for `dfx generate` (portal candid declarations) and to
      # mint the shared identity; the replica and every deploy go through icp.
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Install icp-cli and ic-wasm
        run: |
          npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm
          icp --version

      # One interpreter for the Casals CLI (`build:` runs `make build-backend`,
      # which needs `python3 -m basilisk` on PATH) and for the product builds.
      - name: Install Python toolchain (Casals CLI + Basilisk)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Casals/requirements-dev.txt
          python3 -m pip install -r gos-as-a-service/requirements-dev.txt
          python3 -m basilisk --version || true

      # icp keeps its own identity store. Mint the e2e identity with dfx and
      # import the same key into icp under the name the harness and
      # deploy_realm.py expect (`local-dev`), so both CLIs act as one principal.
      - name: Create the local-dev identity (dfx + icp)
        run: |
          export TERM=xterm
          export DFX_WARNING=-mainnet_plaintext_identity
          dfx identity new local-dev --storage-mode plaintext
          dfx identity export local-dev > /tmp/local-dev.pem
          icp identity import local-dev --from-pem /tmp/local-dev.pem --storage plaintext
          icp_principal=$(icp identity principal --identity local-dev)
          dfx_principal=$(dfx identity get-principal --identity local-dev)
          echo "icp=$icp_principal dfx=$dfx_principal"
          test "$icp_principal" = "$dfx_principal"

      # ── product wasms and dists referenced by casals.json as `local:` ───────
      # scripts/up.sh owns the build recipes (platform file registry wasm,
      # installer + registry backends, portal, the realm halves from ../realms,
      # the token wasm) so that CI, local_up.sh and a production deploy build
      # the same way. The gaas `local` environment hands new realms test flags
      # (test_mode, ii_bypass) through the installer; a production-variant realm
      # wasm refuses them, so the realm halves are built as the test variant here.
      - name: Build everything the sheet references (scripts/up.sh --build-only)
        working-directory: gos-as-a-service
        run: |
          export TERM=xterm
          scripts/up.sh -e local --build-only

      # ── the environment: casals up, graded, populated, and a realm born ─────
      # The same script, remaining phases:
      #  - the Casals harness starts the local replica, funds `local-dev`, then
      #    grades the sheet (fresh: converges from nothing, plan empty, oracle
      #    PASS; idempotent: a second up changes nothing; runtime_stand: a stand
      #    minted at runtime via create_stand converges) and leaves it up;
      #  - `casals up` provisions canisters, not content: the product CLI then
      #    publishes the packages the installer fetches into new realms to the
      #    GaaS file registry (a codex without dependencies and one extension
      #    keep the step short; production publishes everything);
      #  - --smoke-realm: a realm is born the way the portal does it —
      #    request_deployment → installer create_stand → conductor builds the
      #    stand from the `Deployments` template → the realm frontend serves
      #    /canister_ids.js pointing at a backend that answers `status` — and,
      #    because the manifest names the codex and the extension, the installer
      #    fetched them from the file registry into the realm (fails otherwise).
      - name: casals up + publish + verify + portal-path realm (scripts/up.sh)
        working-directory: gos-as-a-service
        env:
          SCENARIOS: fresh,idempotent,runtime_stand
          TIMEOUT_S: "1500"
          REALM_CODEX: dominion
          REALM_EXTENSIONS: hello_world
        run: |
          export TERM=xterm
          scripts/up.sh -e local --skip-build --yes --codices dominion --extensions hello_world --smoke-realm ci-realm

      - name: Show orchestra state on failure
        if: failure()
        working-directory: Casals
        env:
          # The harness keeps each orchestra's bindings in <CASALS_HOME>/<sheet name>/.
          CASALS_HOME: ${{ env.CASALS_HOME }}/gaas
        run: |
          export TERM=xterm
          ls -la "$CASALS_HOME" || true
          python3 -m casals_cli.main -e local --identity local-dev show ../gos-as-a-service/casals.json || true
          python3 -m casals_cli.main -e local --identity local-dev plan ../gos-as-a-service/casals.json || true

      - name: Stop local replica
        if: always()
        working-directory: Casals
        run: |
          export TERM=xterm
          icp network stop -e local || true
