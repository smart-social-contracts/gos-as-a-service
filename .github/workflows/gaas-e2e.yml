name: GaaS E2E

on:
  pull_request:
    paths:
      - "cli/**"
      - "environments/**"
      - "src/**"
      - "dfx.json"
      - "casals_backend.did"
      - ".github/workflows/gaas-e2e.yml"
      - "scripts/e2e_local_realm_baton_topology.py"
  workflow_dispatch:

concurrency:
  group: gaas-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"
  # `gaas new` shells out to `casals new` during create_canisters. No tag works:
  # v0.3.0 has no such command, and v0.3.1 deploys a fresh instance with
  # --mode upgrade, which fails on empty canisters with IC0537. The fix
  # (eb14771 "Make a fresh create one idempotent deploy") is only on main, so
  # pin the commit rather than a release.
  CASALS_VERSION: "d8d86bf563d91f32eba20bcab51b39803c8925b7"

jobs:
  gaas-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The GitHub release has no casals_backend.wasm.gz; use the checkout
      # this job already builds so create/adopt stay on the local replica.
      CASALS_SRC: ${{ github.workspace }}/Casals
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Casals (conductor build + dfx create stub)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/Casals
          ref: ${{ env.CASALS_VERSION }}
          path: Casals
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Basilisk venv (platform backends)
        run: |
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4

      - name: Build Casals conductor stub for dfx create
        run: |
          cd Casals
          python3 -m venv .venv-basilisk
          .venv-basilisk/bin/pip install --upgrade pip
          .venv-basilisk/bin/pip install \
            ic-basilisk==0.14.2 ic-basilisk-toolkit==0.5.3 \
            ic-python-db==0.11.0 ic-python-logging==0.3.4
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          export CANISTER_CANDID_PATH="$(pwd)/casals_backend.did"
          python -m basilisk casals_backend src/main.py
          cp casals_backend.did ../casals_backend.did
          cp .basilisk/casals_backend/casals_backend.wasm ../casals_backend.wasm

      - name: Install npm deps
        run: npm ci --legacy-peer-deps

      # realms-gos "main" pin source-builds the realm backend; its build embeds
      # candid:service metadata with ic-wasm.
      - name: Install ic-wasm
        run: npm install -g @icp-sdk/ic-wasm

      # `casals new` deploys the conductor with icp, not dfx.
      - name: Install icp-cli
        run: |
          npm install -g @icp-sdk/icp-cli
          icp --version

      # icp keeps its own identity store and so cannot see dfx's `default`.
      # Import the same key under the same name so both CLIs act as one
      # principal; otherwise the canisters icp deploys and the ones dfx creates
      # end up with different controllers.
      - name: Share the dfx identity with icp
        run: |
          export TERM=xterm
          export DFX_WARNING=-mainnet_plaintext_identity
          dfx identity get-principal > /dev/null
          dfx identity export default > /tmp/dfx-default.pem
          icp identity import --from-pem /tmp/dfx-default.pem --storage plaintext default
          icp identity default default
          icp_principal=$(icp identity principal --identity default)
          dfx_principal=$(dfx identity get-principal)
          echo "icp=$icp_principal dfx=$dfx_principal"
          test "$icp_principal" = "$dfx_principal"

      - name: Install GaaS CLI
        run: |
          cd cli
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      # Two mismatches between the pinned Casals checkout and this job, both
      # local-only and worth pushing upstream:
      #   1. Casals deploys with icp while the GaaS CLI drives dfx, so both must
      #      address one replica. icp owns it (dfx cannot host an `icp deploy`),
      #      so its gateway moves off the default 8000 onto dfx's 4943 and every
      #      dfx-based phase and the frontend curl keep working unchanged.
      #   2. icp funds canister creation with 2T, where dfx's local default is
      #      100T. At 2T the conductor starves part-way through the sheet deploy
      #      and seed_conductor fails with IC0504.
      - name: Adapt Casals checkout to the local replica
        run: |
          if ! grep -q '^networks:' "$CASALS_SRC/icp.yaml"; then
            printf '\nnetworks:\n  - name: local\n    mode: managed\n    gateway:\n      port: 4943\n' \
              >> "$CASALS_SRC/icp.yaml"
          fi
          sed -i 's/\["--mode", "auto", "-y"\]/["--mode", "auto", "--cycles", "100t", "-y"]/' \
            "$CASALS_SRC/casals_cli.py"
          sed -i 's/\["--mode", mode, "-y"\]/["--mode", mode, "--cycles", "100t", "-y"]/' \
            "$CASALS_SRC/casals_cli.py"
          grep -n -- '--cycles' "$CASALS_SRC/casals_cli.py"
          python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$CASALS_SRC/casals_cli.py"

      # The GaaS CLI sets controllers with `icp ... -n local`, which resolves the
      # network against this project's manifest, and the repo has none. Declare a
      # network that connects to the replica the Casals project hosts, rather
      # than one icp would try to manage a second time.
      - name: Declare the local network for the GaaS project
        run: |
          if [ ! -f icp.yaml ]; then
            printf 'networks:\n  - name: local\n    mode: connected\n    url: http://127.0.0.1:4943\n    root-key: fetch\n' \
              > icp.yaml
          fi
          cat icp.yaml

      - name: Start local replica
        run: |
          export TERM=xterm
          (cd "$CASALS_SRC" && icp network start local -d)
          dfx ping local
          icp network ping local

      - name: gaas new (local descriptor)
        run: |
          export TERM=xterm
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          cd cli
          .venv/bin/gaas new ../environments/local.json --network local --yes \
            --casals-src "$CASALS_SRC"

      - name: Assert canisters running
        run: |
          export TERM=xterm
          cd cli
          .venv/bin/gaas status ../environments/local.json --network local | tee /tmp/gaas-status.txt
          # Casals owns its own file registry, and the GaaS platform is the
          # registry pair plus the installer. The standalone file_registry and
          # marketplace_backend that used to bring this to nine are no longer
          # part of `gaas new`. Name them rather than counting, so a rename
          # cannot pass by keeping the total intact.
          for name in casals_backend casals_frontend casals_file_registry \
                      casals_file_registry_frontend realm_registry_backend \
                      realm_registry_frontend realm_installer; do
            grep -F "$name" /tmp/gaas-status.txt | grep -q running \
              || { echo "missing or not running: $name"; exit 1; }
          done
          running_count=$(grep -c running /tmp/gaas-status.txt || true)
          test "$running_count" -eq 7
          ! grep -i error /tmp/gaas-status.txt

      - name: Assert registry frontend HTTP 200
        run: |
          FRONTEND_ID=$(python3 -c "import json; print(json.load(open('environments/local.json'))['canisters']['realm_registry_frontend'])")
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://${FRONTEND_ID}.localhost:4943/")
          test "$code" = "200"

      # Realm provision regression guard: request_deployment → installer
      # provision_via_casals → stand/backend/frontend/baton in Casals get_tree.
      # Realm WASM/assets come from gaas new seed_file_registry (realms-gos@main
      # source build into casals_file_registry) — not re-published here.
      - name: E2E realm provision (Casals/baton topology)
        run: |
          export TERM=xterm
          cd cli
          .venv/bin/python ../scripts/e2e_local_realm_baton_topology.py \
            --descriptor ../environments/local.json \
            --network local

      - name: Snapshot created canister IDs
        run: |
          python3 - <<'PY'
          import json
          cans = json.load(open("environments/local.json"))["canisters"]
          for key in (
              "realm_installer",
              "realm_registry_backend",
              "realm_registry_frontend",
          ):
              assert cans.get(key), f"missing {key} after create"
          json.dump(cans, open("/tmp/gaas-created-ids.json", "w"))
          print(json.dumps(cans, indent=2, sort_keys=True))
          PY

      - name: gaas new (adopt existing IDs)
        run: |
          export TERM=xterm
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          cd cli
          .venv/bin/gaas new ../environments/local.json --network local --yes \
            --casals-src "$CASALS_SRC" | tee /tmp/gaas-adopt.out
          grep -E "realm_installer: adopt " /tmp/gaas-adopt.out
          grep -E "realm_registry_backend: adopt " /tmp/gaas-adopt.out
          ! grep -E "realm_installer: created " /tmp/gaas-adopt.out
          ! grep -E "realm_registry_backend: created " /tmp/gaas-adopt.out

      - name: Assert adopt reused installer and registry IDs
        run: |
          python3 - <<'PY'
          import json
          created = json.load(open("/tmp/gaas-created-ids.json"))
          current = json.load(open("environments/local.json"))["canisters"]
          for key in (
              "realm_installer",
              "realm_registry_backend",
              "realm_registry_frontend",
          ):
              assert current.get(key) == created[key], (
                  f"{key} changed on adopt: {created[key]} -> {current.get(key)}"
              )
          print("adopt reused installer and registry principals")
          PY

      - name: gaas new (ghost installer must fail closed)
        run: |
          python3 - <<'PY'
          import json
          ghost = "fksuf-niaaa-aaaae-ag22q-cai"
          src = json.load(open("environments/local.json"))
          json.dump(src["canisters"], open("/tmp/gaas-pre-ghost-ids.json", "w"))
          src["canisters"]["realm_installer"] = ghost
          with open("/tmp/local-ghost.json", "w") as fh:
              json.dump(src, fh, indent=2)
              fh.write("\n")
          print(f"ghost descriptor installer={ghost}")
          PY
          export TERM=xterm
          export PATH="$PWD/.venv-basilisk/bin:$PATH"
          set +e
          cli/.venv/bin/gaas new /tmp/local-ghost.json --network local --yes \
            --casals-src "$CASALS_SRC" > /tmp/gaas-ghost.out 2>&1
          code=$?
          set -e
          cat /tmp/gaas-ghost.out
          test "$code" -ne 0
          grep -F "refusing to use realm_installer" /tmp/gaas-ghost.out
          grep -F "IC0301" /tmp/gaas-ghost.out
          python3 - <<'PY'
          import json
          ghost = "fksuf-niaaa-aaaae-ag22q-cai"
          original = json.load(open("/tmp/gaas-pre-ghost-ids.json"))
          live = json.load(open("environments/local.json"))["canisters"]
          ghost_desc = json.load(open("/tmp/local-ghost.json"))["canisters"]
          assert live["realm_installer"] == original["realm_installer"]
          assert live["realm_installer"] != ghost
          assert ghost not in live.values()
          assert ghost_desc["realm_installer"] == ghost
          print("ghost installer refused; live descriptor not baked")
          PY

      - name: Stop local replica
        if: always()
        run: |
          export TERM=xterm
          (cd "$CASALS_SRC" && icp network stop) || true
