name: GaaS E2E

on:
  pull_request:
    paths:
      - "casals.json"
      - "src/**"
      - "dfx.json"
      - "tests/e2e/**"
      - ".github/workflows/gaas-e2e.yml"
  workflow_dispatch:

concurrency:
  group: gaas-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DFX_VERSION: "0.32.0"
  CASALS_VERSION: "main"
  REALMS_VERSION: "main"
  IC_TOKENS_VERSION: "0.1.0"
  # The whole GaaS environment is `casals.json`; the Casals e2e harness builds it
  # from an empty replica and grades it, then a realm is born the way the portal
  # does it. Both scripts share one CASALS_HOME (bindings) and one icp identity.
  CASALS_HOME: ${{ github.workspace }}/casals-home
  CASALS_E2E_ENV: local
  CASALS_E2E_IDENTITY: local-dev
  ENV: local
  IDENTITY: local-dev

jobs:
  gaas-local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The sheet resolves `local:` sources against its own directory:
      # `../realms/...` for the realm stand template, `.basilisk/...` for the
      # platform wasms. The three repos must therefore be siblings.
      - uses: actions/checkout@v4
        with:
          path: gos-as-a-service

      - name: Checkout Casals (conductor + CLI + e2e harness)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/Casals
          ref: ${{ env.CASALS_VERSION }}
          path: Casals
          submodules: recursive

      - name: Checkout realms (realm backend/frontend the stand template installs)
        uses: actions/checkout@v4
        with:
          repository: smart-social-contracts/realms
          ref: ${{ env.REALMS_VERSION }}
          path: realms
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # dfx is only used for `dfx generate` (portal candid declarations) and to
      # mint the shared identity; the replica and every deploy go through icp.
      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/${DFX_VERSION}/dfx-${DFX_VERSION}-x86_64-linux.tar.gz" -o /tmp/dfx.tar.gz
          tar -xzf /tmp/dfx.tar.gz -C /usr/local/bin
          rm /tmp/dfx.tar.gz
          dfx --version

      - name: Install icp-cli and ic-wasm
        run: |
          npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm
          icp --version

      # One interpreter for the Casals CLI (`build:` runs `make build-backend`,
      # which needs `python3 -m basilisk` on PATH) and for the product builds.
      - name: Install Python toolchain (Casals CLI + Basilisk)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Casals/requirements-dev.txt
          python3 -m pip install -r gos-as-a-service/requirements-dev.txt
          python3 -m basilisk --version || true

      # icp keeps its own identity store. Mint the e2e identity with dfx and
      # import the same key into icp under the name the harness and
      # deploy_realm.py expect (`local-dev`), so both CLIs act as one principal.
      - name: Create the local-dev identity (dfx + icp)
        run: |
          export TERM=xterm
          export DFX_WARNING=-mainnet_plaintext_identity
          dfx identity new local-dev --storage-mode plaintext
          dfx identity export local-dev > /tmp/local-dev.pem
          icp identity import local-dev --from-pem /tmp/local-dev.pem --storage plaintext
          icp_principal=$(icp identity principal --identity local-dev)
          dfx_principal=$(dfx identity get-principal --identity local-dev)
          echo "icp=$icp_principal dfx=$dfx_principal"
          test "$icp_principal" = "$dfx_principal"

      # ── product wasms referenced by casals.json as `local:` ─────────────────
      - name: Build GaaS platform backends (realm_installer, realm_registry_backend)
        working-directory: gos-as-a-service
        run: |
          CANISTER_CANDID_PATH="$PWD/src/realm_installer/realm_installer.did" \
            python3 -m basilisk realm_installer src/realm_installer/main.py
          CANISTER_CANDID_PATH="$PWD/src/realm_registry_backend/realm_registry_backend.did" \
            python3 -m basilisk realm_registry_backend src/realm_registry_backend/main.py
          ls -l .basilisk/realm_installer/realm_installer.wasm \
                .basilisk/realm_registry_backend/realm_registry_backend.wasm

      - name: Build GaaS portal (realm_registry_frontend/dist)
        working-directory: gos-as-a-service
        run: |
          npm ci --legacy-peer-deps
          dfx generate realm_registry_backend
          dfx generate realm_installer
          npm run build --workspace=realm_registry_frontend
          test -f src/realm_registry_frontend/dist/index.html

      # The gaas `local` environment hands new realms test flags (test_mode,
      # ii_bypass) through the installer; a production-variant realm wasm
      # refuses them, so the realm halves are built as the test variant here.
      - name: Build realm backend, test variant (realms/.basilisk/realm_backend)
        working-directory: realms
        run: |
          python3 -m pip install -r requirements.txt
          CANISTER_CANDID_PATH="$PWD/src/realm_backend/realm_backend.did" \
            python3 scripts/pack_realm_backend.py --variant test
          ls -l .basilisk/realm_backend/realm_backend.wasm

      - name: Build realm frontend, test variant (realms/src/realm_frontend/dist)
        working-directory: realms
        run: |
          # Root workspace install (a workspace-local install strands vite away
          # from the hoisted @sveltejs/kit), then the workspace package the
          # frontend imports, then the frontend itself.
          npm install --legacy-peer-deps
          npm run build --workspace packages/extension-bridge
          (cd src/realm_frontend && REALMS_BUILD_VARIANT=test npm run build && test -f dist/index.html)
          python3 scripts/check_frontend_variant.py src/realm_frontend/dist test

      - name: Fetch ic-tokens token_backend.wasm (realms/.external-wasms)
        working-directory: realms
        run: |
          mkdir -p .external-wasms
          curl -fsSL "https://github.com/smart-social-contracts/ic-tokens/releases/download/v${IC_TOKENS_VERSION}/token_backend.wasm" \
            -o .external-wasms/token_backend.wasm
          ls -l .external-wasms/token_backend.wasm

      # ── the environment: casals up from an empty replica, graded ────────────
      # run_e2e.py starts the local replica itself (`icp network start -e local`),
      # funds `local-dev`, then runs the scenarios against the gaas sheet:
      #   fresh          — `casals up` converges from nothing, `plan` empty, oracle PASS
      #   idempotent     — a second `up` changes nothing (covers adopt/heal re-runs)
      #   runtime_stand  — a stand minted at runtime via create_stand converges
      # KEEP=1 leaves the replica and the orchestra up for the next step.
      - name: casals up gaas sheet + e2e scenarios (Casals harness)
        working-directory: Casals
        env:
          KEEP: "1"
          SCENARIOS: fresh,idempotent,runtime_stand
        run: |
          export TERM=xterm
          python3 tests/e2e/run_e2e.py ../gos-as-a-service/casals.json

      # ── a realm is born the way the portal does it ──────────────────────────
      # request_deployment → installer create_stand → conductor builds the stand
      # from the `Deployments` template → realm frontend serves /canister_ids.js
      # pointing at a backend that answers `status`.
      - name: Deploy a realm through the portal path
        working-directory: gos-as-a-service
        env:
          TIMEOUT_S: "1500"
        run: |
          export TERM=xterm
          python3 tests/e2e/deploy_realm.py ci-realm

      - name: Show orchestra state on failure
        if: failure()
        working-directory: Casals
        env:
          # The harness keeps each orchestra's bindings in <CASALS_HOME>/<sheet name>/.
          CASALS_HOME: ${{ env.CASALS_HOME }}/gaas
        run: |
          export TERM=xterm
          ls -la "$CASALS_HOME" || true
          python3 -m casals_cli.main -e local --identity local-dev show ../gos-as-a-service/casals.json || true
          python3 -m casals_cli.main -e local --identity local-dev plan ../gos-as-a-service/casals.json || true

      - name: Stop local replica
        if: always()
        working-directory: Casals
        run: |
          export TERM=xterm
          icp network stop -e local || true
